<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnóstico de Governança</title>
  <style>
    body { max-width: 900px; margin: 0 auto; padding: 24px; font-family: system-ui, sans-serif; line-height: 1.5; }
    pre { overflow: auto; padding: 16px; background: #f4f4f4; border-radius: 8px; white-space: pre-wrap; }
    .ok { font-weight: 700; }
  </style>
</head>
<body>
  <h1>Diagnóstico de Governança</h1>
  <div id="result">Executando...</div>

  <script type="module">
    const requiredFiles = [
      '../.projeto/PLANO_MESTRE.md',
      '../.projeto/METODOLOGIA_DESENVOLVIMENTO.md',
      '../.projeto/AUTOMACAO.md',
      '../.projeto/STATUS.md',
      '../.projeto/DECISOES_TECNICAS.md',
      '../data/catalog-v1/config.json',
      '../src/catalog/index.js',
      '../src/services/index.js'
    ];

    const result = document.querySelector('#result');

    async function checkFile(path) {
      const response = await fetch(path, { cache: 'no-store' });
      return { path, ok: response.ok, status: response.status };
    }

    try {
      const checks = await Promise.all(requiredFiles.map(checkFile));
      const failures = checks.filter(item => !item.ok);

      if (failures.length) {
        throw new Error(
          'Arquivos obrigatórios ausentes:\n' +
          failures.map(item => `${item.status} - ${item.path}`).join('\n')
        );
      }

      result.innerHTML = `
        <p class="ok">✅ Governança e arquivos-base validados com sucesso.</p>
        <pre>${JSON.stringify(checks, null, 2)}</pre>
      `;
    } catch (error) {
      result.innerHTML = `
        <p><strong>❌ Falha na governança.</strong></p>
        <pre>${String(error?.stack || error)}</pre>
      `;
    }
  </script>
</body>
</html>
